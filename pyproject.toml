[project]
name = "getnet-challenge"
version = "0.1.0"
description = "Multi-agent customer support for Getnet merchants: Router, Knowledge (RAG), Customer Support and Human Escalation agents behind one FastAPI endpoint."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langsmith>=0.14.14",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".vectorstore"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "SIM", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pyright]
include = ["app", "tests", "scripts", "evals"]
exclude = [".venv", ".vectorstore", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnknownMemberType = "none"
reportMissingTypeStubs = "none"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
